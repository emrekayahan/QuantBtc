services:
  quant-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-bot-live
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/telemetry"]
      interval: 30s
      timeout: 5s
      retries: 3
